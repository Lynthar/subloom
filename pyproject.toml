[build-system]
# >=77 for SPDX `license` expression + `license-files` support
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "subloom"
version = "0.2.0"
description = "Local video subtitle generation and translation CLI tool"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
keywords = ["subtitle", "whisper", "translation", "cli", "ollama"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    "faster-whisper>=1.0.0",
    "ollama>=0.5.0",
    # Imported directly (Timeout, TransportError), not only reached through ollama.
    "httpx>=0.27",
    "ffmpeg-python>=0.2.0",
    "pysrt>=1.1.2",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    # Upper bounds keep the gate reproducible: ruff's rule set and pytest's
    # collection behaviour both shift between minor releases.
    "pytest>=9,<10",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.16,<0.17",
    "mypy>=1.8,<3",
    "types-PyYAML",
    "types-tqdm",
]
whisperx = [
    # 3.8.1 is the first that can load a cached alignment model without asking the Hub.
    "whisperx>=3.8.1",
]
qwen3-asr = [
    "qwen-asr>=0.0.6,<0.1",
    # qwen-asr imports torch without declaring it.
    "torch>=2.4",
    "soundfile>=0.12",
]
serve = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    # server/models.py uses Pydantic v2 API (field_validator); FastAPI's own
    # range still admits v1, so pin the major here.
    "pydantic>=2.0",
]

[project.scripts]
subloom = "subloom.cli.app:cli"

[project.urls]
Repository = "https://github.com/Lynthar/subloom"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# The gate is this explicit set, not ruff's default set: that one grows with each
# release, so a ruff upgrade would arrive as a tree-wide diff instead of a finding.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
# Third-party deprecations inside starlette's TestClient, matched by message so that any
# other deprecation still shows; drop each once starlette stops raising it.
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.mypy]
# One minor above the 3.11 floor: mypy parses every installed .pyi at this syntax
# level and the locked numpy stubs need 3.12. Lowering it halts the run on numpy
# before src/ is ever checked; the pytest matrix covers 3.11 itself.
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

# These ship neither stubs nor py.typed, and torch / whisperx / qwen_asr are not installed
# where mypy runs in CI (no model extras). Everything else must resolve.
[[tool.mypy.overrides]]
module = [
    "faster_whisper", "faster_whisper.*", "ffmpeg", "pysrt", "qwen_asr", "qwen_asr.*", "torch",
    "whisperx", "whisperx.*",
]
ignore_missing_imports = true
