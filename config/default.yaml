# subtitle-forge default configuration
#
# NOTE: this file is the documented REFERENCE COPY of the defaults — it is
# NOT loaded at runtime. The authoritative defaults live in
# src/subtitle_forge/models/config.py; your editable copy lives at
# ~/.config/subtitle-forge/config.yaml (Windows: %APPDATA%\subtitle-forge\).
# tests/test_config.py keeps this file in sync with the code defaults.

asr:
  # Speech recognition backend; its settings live in the section of the same name below
  # Options: whisper, qwen3_asr
  backend: whisper

whisper:
  # Whisper model name
  # Options: tiny, base, small, medium, large-v2, large-v3, distil-large-v3
  model: large-v3

  # Device: cuda or cpu
  device: cuda

  # Compute precision: float16, int8_float16, int8
  # float16: faster, requires more VRAM
  # int8_float16: balanced
  # int8: less VRAM, slightly slower
  compute_type: float16

  # Beam search size
  beam_size: 5

  # Voice Activity Detection filter. Off decodes the whole audio, the quiet speech VAD may drop
  # included, with hallucination guards on; about ten times slower unless batch_size is set
  vad_filter: true

  # Batch size (uses BatchedInferencePipeline); null for standard inference. Without VAD it
  # decodes blind 30-second clips: minutes instead of an hour, but rougher lines
  batch_size: null

  # Model cache directory (null = the HuggingFace default under ~/.cache)
  download_root: null

  # VAD timing parameters. Subtitle on-screen feel is controlled by
  # timestamp.lead_in_ms / linger_ms below — these only affect how the VAD
  # cuts speech segments, NOT how long each subtitle is shown.
  speech_pad_ms: 250
  min_silence_duration_ms: 700

  # WhisperX (better word-level alignment, requires the [whisperx] extra)
  use_whisperx: true
  whisperx_align: true

  # HuggingFace token, only needed for gated / private model repos
  hf_token: null

  # HuggingFace mirror (e.g. https://hf-mirror.com); sets HF_ENDPOINT for the whole process
  hf_endpoint: null

qwen3_asr:
  # Qwen3-ASR (requires the [qwen3-asr] extra). Strong on Chinese / Japanese / Korean;
  # 30 languages. Alternative: Qwen/Qwen3-ASR-0.6B (~1.9GB instead of ~4.7GB)
  model: Qwen/Qwen3-ASR-1.7B

  # Forced aligner that supplies word timing (~1.8GB); it aligns 11 languages:
  # zh, en, yue, fr, de, it, ja, ko, pt, ru, es
  aligner_model: Qwen/Qwen3-ForcedAligner-0.6B

  # Device: cuda or cpu. Without FlashAttention 2 (flash-attn) installed, clips longer
  # than ~8s encode with reduced accuracy; a warning says so at load time.
  device: cuda

  # Audio is cut into ~15-second chunks; this many run per inference batch.
  # Lower it if the GPU runs out of memory.
  batch_size: 4

  # Model cache directory (null = the HuggingFace default under ~/.cache)
  download_root: null

  # HuggingFace token, only needed for gated / private model repos
  hf_token: null

  # HuggingFace mirror (e.g. https://hf-mirror.com); sets HF_ENDPOINT for the whole process
  hf_endpoint: null

translation:
  # Translation backend; its connection settings live in the section of the same name below.
  # LLMs: ollama, openai (any OpenAI-compatible chat API: LM Studio, llama.cpp, vLLM,
  # Ollama's /v1, or a cloud service). Machine translation: deepl, google.
  # Only the backend named here is ever used.
  backend: ollama

  # Maximum retry attempts on transport errors, rate limits and server errors
  max_retries: 3

  # Per-request timeout in seconds. Long-running prompts will fail fast
  # instead of hanging the whole job.
  request_timeout: 180.0

  # The rest apply to the LLM backends only.

  # Generation temperature. Translation is deterministic — keep at 0 unless
  # you want to experiment with creative paraphrasing.
  temperature: 0.0

  # Subtitles per translation batch. The translator will auto-clamp this
  # downward for smaller models (7B / 14B) where large batches degrade
  # parsing reliability.
  max_batch_size: 10

  # Prompt library template id (null = the built-in JSON prompt).
  # `config set-prompt` stores your own text as the template "custom" and selects it.
  prompt_template_id: null

ollama:
  # Ollama model name
  model: qwen2.5:14b

  # Ollama API address
  host: http://localhost:11434

openai:
  # Endpoint including the /v1 suffix, e.g. http://localhost:1234/v1 (LM Studio),
  # http://localhost:8080/v1 (llama.cpp), https://api.openai.com/v1. Required, no default.
  base_url: ""

  # Model id as the server lists it at <base_url>/models. Required.
  model: ""

  # API key; local servers usually need none. The SUBTITLE_FORGE_OPENAI_API_KEY
  # environment variable takes precedence and keeps the key out of this file.
  api_key: null

deepl:
  # DeepL API key; a Free key (ending in ":fx") goes to the Free endpoint automatically.
  # The SUBTITLE_FORGE_DEEPL_API_KEY environment variable takes precedence.
  api_key: null

google:
  # Google Cloud Translation Basic (v2) API key.
  # The SUBTITLE_FORGE_GOOGLE_API_KEY environment variable takes precedence.
  api_key: null

output:
  # Output file encoding
  encoding: utf-8

  # Keep original language subtitles
  keep_original: true

  # Generate bilingual subtitles
  bilingual: false

  # Original text on top in bilingual mode
  original_on_top: true

  # Drop subtitles that hold nothing but interjections ("ああ", "うん", "嗯", "uh"), from the
  # original-language file too, so they are never translated. One with a word in it stays.
  drop_interjections: false

  # Join a subtitle that stops mid-sentence to the next one, across a pause of up to 1 s and
  # within 7 s and two lines. Translated apart, such fragments lose their meaning ("見せ" /
  # "てみろ。" -> "给" / "我看看。"). Runs after drop_interjections, so a dropped "うん" never joins.
  merge_fragments: true

# Maximum concurrent workers for batch processing
max_workers: 2

# Log level: DEBUG, INFO, WARNING, ERROR
log_level: INFO

# Log file path (null = no file logging)
log_file: null

# Timestamp post-processing settings
timestamp:
  # Enable timestamp post-processing
  enabled: true

  # Processing mode:
  #   "off"     - No processing apart from lead-in/linger
  #   "minimal" - Fix overlaps + ensure minimum duration (recommended)
  #   "full"    - Complete processing: split segments, extend times, fix all issues
  mode: "minimal"

  # Minimum subtitle on-screen duration in seconds.
  # 1.0s is the lower bound for comfortable reading; 0.5s is too short.
  min_duration: 1.0

  # Maximum subtitle duration in seconds
  max_duration: 8.0

  # Minimum gap between subtitles in seconds
  min_gap: 0.05

  # Gap threshold for "may indicate missed speech" warning (seconds).
  # 10s catches real misses without warning on every silent shot in a movie.
  max_gap_warning: 10.0

  # Reading speed for Western languages (chars per second)
  chars_per_second: 15.0

  # Reading speed for CJK languages (Chinese/Japanese/Korean), in full-width characters:
  # a half-width character (Latin, digits, ｶﾅ) counts 0.5. CJK characters are denser, so slower.
  cjk_chars_per_second: 10.0

  # Minimum text length before attempting to split segments (full mode only)
  split_threshold: 30

  # Split segments by sentence boundaries using word-level timestamps
  # This helps when WhisperX groups multiple sentences into one segment
  # Recommended for dialogue-heavy videos (movies, TV shows, interviews)
  split_sentences: true

  # Lead-in: show each subtitle this many ms BEFORE the first word's onset.
  # Compensates for acoustic-alignment timestamps being too tight for
  # comfortable reading. Typical range: 50-150ms. Set 0 to disable.
  lead_in_ms: 80

  # Linger: keep each subtitle on screen this many ms AFTER the last word
  # ends. Industry standard (BBC/Netflix) is 200-500ms. Without this,
  # subtitles feel like they "vanish" the moment speech stops.
  linger_ms: 300
